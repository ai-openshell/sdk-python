# Nightly comparison of core main with the pinned core tag; keeps the single
# "Core main drift" issue current (mise run core:drift). Uses the shared
# workflow from ai-openshell/workflows (core-sync/). Its commit is the pin for
# the core-sync scripts too: scripts/core-sync.sh reads it from this line.
name: core-drift

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    uses: pimlock/workflows/.github/workflows/core-drift.yml@33ae68eb87030b53b479f4ed8426f458c1d52b2d # feat/core-sync/pimlock
