# Nightly comparison of core main with the pinned core tag; keeps the single
# "Core main drift" issue current (mise run core:drift). Uses the shared
# workflow from ai-openshell/workflows (core-sync/). Keep the ref in step with
# the core-sync tasks in mise.toml.
name: core-drift

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    uses: pimlock/workflows/.github/workflows/core-drift.yml@63d4b041b9b99fdfa3491573d31a537451a427ab # feat/core-sync/pimlock
