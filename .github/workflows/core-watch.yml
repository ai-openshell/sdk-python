# SPDX-License-Identifier: Apache-2.0

# Opens one update proposal per new core release tag (mise run core:bump),
# with the shared workflow from ai-openshell/workflows (core-sync/). Keep the
# ref in step with the core-sync tasks in mise.toml.
name: core-watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Core tag to propose (vX.Y.Z or vX.Y.Z-pre.N); empty proposes every new tag
        required: false
        default: ""

permissions:
  contents: read

jobs:
  watch:
    uses: pimlock/workflows/.github/workflows/core-watch.yml@63d4b041b9b99fdfa3491573d31a537451a427ab # feat/core-sync/pimlock
    with:
      tag: ${{ inputs.tag }}
