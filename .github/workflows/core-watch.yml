# Opens one update proposal per new core release tag (mise run core:bump),
# with the shared workflow from ai-openshell/workflows (core-sync/).
name: core-watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Core tag to propose (vX.Y.Z or vX.Y.Z-pre.N); empty proposes every new tag
        required: false
        default: ""

permissions:
  contents: read

jobs:
  watch:
    uses: pimlock/workflows/.github/workflows/core-watch.yml@33ae68eb87030b53b479f4ed8426f458c1d52b2d # feat/core-sync/pimlock
    with:
      tag: ${{ inputs.tag }}
