[project]
name = "openshell"
version = "0.0.0"
description = "OpenShell is the safe, private runtime for autonomous AI agents. "
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "NVIDIA Inc." }]
requires-python = ">=3.11"
dependencies = [
    "cloudpickle>=3.0",
    "grpcio>=1.60",
    "httpx>=0.27",
    "protobuf-py>=0.7,<0.8",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
keywords = ["agent", "sandbox", "nvidia"]

[project.urls]
source = "https://github.com/ai-openshell/python-sdk"
documentation = "https://docs.nvidia.com/openshell/latest/"

[build-system]
requires = ["hatchling>=1.27,<2", "buf-bin==1.75.0"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "build/hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.4",
    "ty>=0.0.94",
    "pyyaml==6.0.2",
    "types-pyyaml>=6.0.12.20260518",
    "types-grpcio>=1.0.0.20251009",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["openshell"]
